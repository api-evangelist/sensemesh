name: Sensemesh
description: Sensemesh builds an AI-powered operating system that unifies cameras, sensors,
  and drones into a single intelligent network for real-time perception and autonomous
  response. The platform fuses visual, thermal, audio, and pressure sensor data so
  organizations can detect threats, investigate incidents, dispatch drones autonomously,
  and query sensor history in natural language across law enforcement, corrections and
  prisons, events and venues, homeowners associations, and schools and universities.
  Backed by DCVC, Sensemesh was added to the API Evangelist network as a portfolio lead;
  as of this enrichment pass the company publishes a single marketing site (sensemesh.ai)
  with no public API, SDK, developer documentation, or well-known metadata.
